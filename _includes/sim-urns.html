<figure class="demo" id="leadership-demo">
<div class="controls">
<div class="slider"><label for="alpha">Reinforcement strength α</label>
<input type="range" id="alpha" min="0" max="1" step="0.05" value="0.75"><output id="alphaOut" for="alpha">0.75</output></div>
<button id="leadRun" type="button">Run again</button>
</div>
<canvas id="ribbon" role="img" aria-label="Strip coloured by which urn is in the lead over time"></canvas>
<div class="bars" id="bars"></div>
<p class="status" id="leadStatus" aria-live="polite"></p>
<div class="criterion">
<div class="f">One urn eventually leads forever if and only if <span class="m">∑<sub>k</sub> 1/f(k)<sup>2</sup> &lt; ∞</span>. For <span class="m">f(k) = (k+1)<sup>α</sup></span> that means <span class="m">α &gt; ½</span>.</div>
<div class="verdict" id="leadVerdict"></div>
</div>
</figure>
