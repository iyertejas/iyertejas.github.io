<figure class="demo" id="ev-demo">
<div class="controls">
<div class="slider"><label for="evP">Coin <i>P</i>: heads with probability <i>p</i></label>
<input type="range" id="evP" min="0.01" max="0.99" step="0.01" value="0.7"><output id="evPOut" for="evP">0.70</output></div>
<div class="slider"><label for="evQ">Coin <i>Q</i>: heads with probability <i>q</i></label>
<input type="range" id="evQ" min="0.01" max="0.99" step="0.01" value="0.5"><output id="evQOut" for="evQ">0.50</output></div>
</div>
<p class="rt-p" id="evScore"></p>
<div class="controls rt-buttons">
<div class="rt-field"><label for="evDelta">δ</label>
<select id="evDelta"><option value="1">10⁻¹</option><option value="2">10⁻²</option><option value="3" selected>10⁻³</option><option value="4">10⁻⁴</option></select></div>
<button id="evNew" type="button">New runs</button>
</div>
<svg class="l2-chart" id="evWalk" viewBox="0 0 680 300" role="img" aria-label="Total score against the number of flips for many runs of coin P, with the level log(1/delta) and the line N times KL(P||Q)"></svg>
<div class="l2-legend" id="evWalkLegend"></div>
<p class="status" id="evStatus" aria-live="polite"></p>
</figure>
