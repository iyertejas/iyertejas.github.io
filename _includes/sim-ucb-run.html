<figure class="demo" id="ucbrun-demo">
<div class="controls">
<div class="rt-field"><label for="urPol">Policy</label>
<select id="urPol"><option value="ucb" selected>UCB(1/n²)</option><option value="greedy">Greedy</option></select></div>
<div class="slider"><label for="urGap">Gap Δ</label>
<input type="range" id="urGap" min="0.1" max="1" step="0.05" value="0.5"><output id="urGapOut" for="urGap">0.50</output></div>

</div>
<div class="controls rt-buttons">
<button id="urStep" type="button">Step</button>
<button id="urPlay" type="button">Play</button>
<button id="urNew" type="button">New run</button>
<div class="rt-field"><label for="urSpeed">Speed</label>
<select id="urSpeed"><option value="slow">slow</option><option value="medium" selected>medium</option><option value="fast">fast</option></select></div>
<span class="rt-round" id="urRound"></span>
</div>
<svg class="l2-chart" id="urTop" viewBox="0 0 680 180" role="img" aria-label="UCB: the arms, their empirical means and true means"></svg>
<p class="status" id="urStatus" aria-live="polite"></p>
<svg class="l2-chart" id="urLow" viewBox="0 0 680 260" role="img" aria-label="UCB: the number of pulls of each arm over time"></svg>
<p class="l2-key"><span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="var(--ink)"/></svg> empirical mean</span><span><svg width="26" height="14" aria-hidden="true"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="6" stroke-opacity=".22"/></svg> m̂<sub><i>a</i></sub> ± <i>w<sub>a</sub></i>(<i>N<sub>a</sub></i>)</span><span><svg width="14" height="14" aria-hidden="true"><line x1="7" y1="0" x2="7" y2="14" stroke="var(--ink)" stroke-width="4"/></svg> index</span><span><svg width="14" height="14" aria-hidden="true"><line x1="7" y1="0" x2="7" y2="14" stroke="var(--muted)" stroke-width="2"/></svg> true mean</span><span><svg width="22" height="14" aria-hidden="true"><line x1="1" y1="7" x2="21" y2="7" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/></svg> bound 3 + 16 log <i>n</i> / Δ<sub><i>a</i></sub>² of Theorem 2.6 (lower panel)</span></p>
</figure>
