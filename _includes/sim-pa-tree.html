<figure class="demo" id="pa-demo">
<div class="controls">
<div class="slider"><label for="paAlpha">Reinforcement strength α</label>
<input type="range" id="paAlpha" min="0" max="1" step="0.05" value="0.8"><output id="paAlphaOut" for="paAlpha">0.80</output></div>
<button id="paRun" type="button">Grow a new tree</button>
</div>
<canvas class="treeCanvas" id="paTree" role="img" aria-label="A growing random tree; vertex size shows degree"></canvas>
<p class="status" id="paStatus" aria-live="polite"></p>
</figure>
