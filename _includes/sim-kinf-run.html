<figure class="demo" id="kinfrun-demo">
<div class="controls">
<div class="rt-field"><label for="krArms">Rewards</label>
<select id="krArms"><option value="two" selected>m ± 0.1</option><option value="fixed">always m</option><option value="ber">Bernoulli</option></select></div>
</div>
<div class="controls rt-buttons">
<button id="krStep" type="button">Step</button>
<button id="krPlay" type="button">Play</button>
<button id="krNew" type="button">New run</button>
<div class="rt-field"><label for="krSpeed">Speed</label>
<select id="krSpeed"><option value="slow">slow</option><option value="medium" selected>medium</option><option value="fast">fast</option></select></div>
<span class="rt-round" id="krRound"></span>
</div>
<svg class="l2-chart" id="krTop" viewBox="0 0 680 244" role="img" aria-label="For each arm and each policy: the number of pulls, the empirical mean and the index, with the true mean"></svg>
<p class="l2-key"><span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="var(--ink)"/></svg> empirical mean</span><span><svg width="26" height="14" aria-hidden="true"><line x1="1" y1="7" x2="25" y2="7" stroke="var(--ink)" stroke-width="6" stroke-opacity=".22"/></svg> up to the index</span><span><svg width="14" height="14" aria-hidden="true"><line x1="7" y1="0" x2="7" y2="14" stroke="var(--ink)" stroke-width="4"/></svg> index</span><span><svg width="14" height="14" aria-hidden="true"><line x1="7" y1="0" x2="7" y2="14" stroke="var(--muted)" stroke-width="2"/></svg> true mean</span></p>
<p class="status" id="krStatus" aria-live="polite"></p>
<svg class="l2-chart" id="krLow" viewBox="0 0 680 240" role="img" aria-label="The regret of both policies over time"></svg>
<div class="l2-legend" id="krLowKey"></div>
</figure>
