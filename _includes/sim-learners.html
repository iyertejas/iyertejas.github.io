<figure class="demo" id="learn-demo">
<div class="controls">
<div class="slider"><label for="lAlpha">Reinforcement strength α</label>
<input type="range" id="lAlpha" min="0.25" max="1.75" step="0.05" value="1.5"><output id="lAlphaOut" for="lAlpha">1.50</output></div>
<button id="learnRun" type="button">Run again</button>
</div>
<div class="two">
<div>
<h3>400 learners at this α</h3>
<p class="learn-sub">Each chooses an option with probability proportional to (its successes + 1)<sup>α</sup>.</p>
<canvas class="dots" id="dotsR" role="img" aria-label="400 reinforcement learners coloured by the option they settled on"></canvas>
<div class="tally" id="tallyR" aria-live="polite"></div>
</div>
<div>
<h3>Across all α</h3>
<p class="learn-sub">Share settled on the better option (green) and on the worse option (red); the grey band marks your α.</p>
<canvas id="learnCurve" role="img" aria-label="Share of learners settled on the better and on the worse option, as a function of the reinforcement strength"></canvas>
</div>
</div>
<div class="legend"><span>Late choices on the worse option</span><span class="grad" id="learnGrad" aria-hidden="true"></span><span>on the better option</span></div>
</figure>
