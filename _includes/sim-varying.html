<figure class="demo" id="bpve-demo">
<div class="controls">
<div class="slider"><label for="bpveB">Jackpot growth b</label>
<input type="range" id="bpveB" min="1.5" max="8" step="0.5" value="3"><output id="bpveBOut" for="bpveB">3.0</output></div>
<div class="algs" id="bpveCand" role="group" aria-label="Candidate growth scale">
<button type="button" aria-pressed="true" data-c="2" style="--sw:var(--c4)"><span class="m">C<sub>n</sub> = 2<sup>n</sup></span></button>
<button type="button" aria-pressed="false" data-c="M" style="--sw:var(--c4)"><span class="m">C<sub>n</sub> = M<sub>n</sub> ≈ 6<sup>n</sup></span></button>
</div>
<button id="bpveRun" type="button">Run again</button>
</div>
<div class="two">
<div>
<div class="small-lab">The process: Z<sub>n</sub>/C<sub>n</sub> (log scale), 40 runs. Blue runs never felt the truncation, so in them Z<sub>n</sub> = <span class="tilde">Z</span><sub>n</sub>.</div>
<canvas id="bpvePlot" role="img" aria-label="Population size divided by the candidate growth scale, for 40 runs over 30 generations"></canvas>
</div>
<div>
<div class="small-lab">The truncated process: <span class="tilde">Z</span><sub>n</sub>/<span class="tilde">M</span><sub>n</sub> (log scale), the same 40 runs with X<sub>n</sub> truncated at 4C<sub>n+1</sub></div>
<canvas id="bpveTrunc" role="img" aria-label="Truncated population divided by its mean, for the same 40 runs"></canvas>
</div>
</div>
<p class="status" id="bpveStatus" aria-live="polite"></p>
<div class="criterion">
<div class="f">Truncate each <span class="m">X<sub>n</sub></span> at <span class="m">γC<sub>n+1</sub></span>, to <span class="m">Y<sub>n</sub> = X<sub>n</sub> 1{X<sub>n</sub> ≤ γC<sub>n+1</sub>}</span>, to obtain a branching process <span class="m"><span class="tilde">Z</span><sub>n</sub></span> with mean <span class="m"><span class="tilde">M</span><sub>n</sub></span>. Then <span class="m">C<sub>n</sub></span> is a growth scale if and only if, for some γ &gt; 0:</div>
<ul class="checks">
<li><b id="bpveV1"></b> in a population of size <span class="m">C<sub>n</sub></span>, only finitely many individuals are truncated on average: <span class="m">∑ C<sub>n</sub> P(X<sub>n</sub> &gt; γC<sub>n+1</sub>) &lt; ∞</span>;</li>
<li><b id="bpveV2"></b> <span class="m">C<sub>n</sub></span> is comparable to <span class="m"><span class="tilde">M</span><sub>n</sub></span>;</li>
<li><b id="bpveV3"></b> the truncated process satisfies Kesten–Stigum: <span class="m"><span class="tilde">Z</span><sub>n</sub>/<span class="tilde">M</span><sub>n</sub></span> converges in L<sup>1</sup>, equivalently <span class="m">∑ E[<span class="hat">Y</span><sub>n</sub> − 1]/<span class="tilde">M</span><sub>n+1</sub> &lt; ∞</span>.</li>
</ul>
<div class="verdict" id="bpveVerdict"></div>
</div>
</figure>
